name: task-tracker-de24

services:
  log-init:
    image: alpine:3.24
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /logs/app /logs/nginx && chown 10001:10001 /logs/app && chown 101:101 /logs/nginx"]
    volumes:
      - service_logs:/logs
    restart: "no"

  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Copy .env.example to .env and set passwords}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD:?Set TASK_DB_PASSWORD in .env}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?Set EXPORTER_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_tracker"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  task-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: task_tracker
      PGUSER: task_app
      PGPASSWORD: ${TASK_DB_PASSWORD:?Set TASK_DB_PASSWORD in .env}
      APP_LOG_FILE: /var/log/task-tracker/app.jsonl
    expose: ["3000"]
    volumes:
      - service_logs:/var/log/task-tracker
    networks: [front, data, observability]
    depends_on:
      db:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - service_logs:/var/log/nginx
    networks: [front, observability]
    depends_on:
      task-app:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.10
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/task_tracker?sslmode=disable
      DATA_SOURCE_USER: metrics_exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD:?Set EXPORTER_DB_PASSWORD in .env}
    expose: ["9187"]
    networks: [data, observability]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.2
    command: ["--nginx.scrape-uri=http://nginx:8080/nginx_status"]
    expose: ["9113"]
    networks: [front, observability]
    depends_on: [nginx]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.2
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    expose: ["8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]
    depends_on: [task-app, postgres-exporter, nginx-exporter, cadvisor]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  promtail:
    image: grafana/promtail:3.7.8
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - service_logs:/var/log/collected:ro
    networks: [observability]
    depends_on:
      log-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [observability]
    depends_on: [prometheus, loki]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  service_logs:

networks:
  front:
  data:
    internal: true
  observability:
    internal: true
